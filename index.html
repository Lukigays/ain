<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error - Report Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #090d16;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Background */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(45deg, #ff3366, #7928ca);
            filter: blur(160px);
            top: 15%;
            left: 10%;
            z-index: 0;
            opacity: 0.4;
        }

        body::after {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            filter: blur(150px);
            bottom: 15%;
            right: 10%;
            z-index: 0;
            opacity: 0.4;
        }

        .container {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 3rem 2rem;
            border-radius: 28px;
            text-align: center;
            max-width: 440px;
            width: 90%;
            z-index: 1;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .badge {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        p.desc {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .error-code-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 2.5rem;
        }

        .code-label {
            font-size: 0.75rem;
            color: #4b5563;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 0.2rem;
        }

        .code-text {
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
        }

        .btn-grup-kendala {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #7928ca, #ff007f);
            box-shadow: 0 8px 24px rgba(121, 40, 202, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-grup-kendala:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(121, 40, 202, 0.5);
            opacity: 0.95;
        }

        .btn-grup-kendala:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Status Badge -->
        <div class="badge">System Blocked</div>
        
        <!-- Judul -->
        <h1>Yah, Mentok Di Sini!</h1>
        
        <!-- Kalimat Gen Z Direct -->
        <p class="desc">
            Sistemnya mendadak mogok dan nggak bisa di-bypass otomatis. Daripada pusing sendirian, mending langsung masuk grup buat lapor kendalana biar langsung dibantu sama tim!
        </p>

        <!-- Informasi Error Gimmick -->
        <div class="error-code-box">
            <div class="code-label">Status Log</div>
            <div class="code-text">BYPASS_FAILED_403</div>
        </div>

        <!-- Tombol Utama Langsung ke Grup -->
        <div class="btn-group">
            <!-- Ganti '#' dengan link Telegram / WhatsApp / Discord kamu -->
            <a href="#" target="_blank" class="btn btn-grup-kendala">
                💬 Masuk Grup / Lapor Kendala
            </a>
        </div>
    </div>

</body>
</html>
