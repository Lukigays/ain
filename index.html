<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Error System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Background Glow Effect ala Gen Z */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            filter: blur(150px);
            top: 10%;
            left: 15%;
            z-index: 0;
            opacity: 0.5;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #00dfd8, #0070f3);
            filter: blur(150px);
            bottom: 10%;
            right: 15%;
            z-index: 0;
            opacity: 0.5;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2.5rem;
            border-radius: 24px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 1;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .error-tag {
            background: linear-gradient(90deg, #ff007f, #7928ca);
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        p.subtitle {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .status-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 2rem;
        }

        .status-title {
            font-size: 0.8rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .status-text {
            color: #10b981;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-dots {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: #ffffff;
            color: #0b0f19;
        }

        .btn-primary:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tag Gimmick -->
        <div class="error-tag">System Bypassed</div>
        
        <!-- Kalimat Utama -->
        <h1>Waduh, Ketahan Bentar!</h1>
        
        <!-- Kata-kata Santai / Gen Z -->
        <p class="subtitle">
            Aman, nggak usah panik alias *chill aja*. Sistemnya lagi disensor dikit, tapi kita udah siapin jalan tikusnya buat kamu. Tinggal sekali klik langsung tembus!
        </p>

        <!-- Status Box -->
        <div class="status-box">
            <div class="status-title">Status Jaringan</div>
            <div class="status-text">
                <div class="status-dots"></div>
                Bypass Ready to Launch
            </div>
        </div>

        <!-- Tombol Aksi & Grup Kendala -->
        <div class="btn-group">
            <!-- Ganti '#' dengan link bypass tujuanmu -->
            <a href="#" class="btn btn-primary" onclick="alert('Bypassing system... gas!')">Lanjut ke Tujuan</a>
            
            <!-- Ganti '#' dengan link grup Telegram/WhatsApp kamu -->
            <a href="https://t.me/lukyyplr" target="_blank" class="btn btn-secondary">
                💬 Ada Kendala? Masuk Grup Sini
            </a>
        </div>
    </div>

</body>
</html>
